name: Deploy Convex backend
on:
  push:
    branches: [main]
    paths: ["convex/**", "convex.json", "package.json", "pnpm-lock.yaml", ".github/workflows/backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convex-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Deploy production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          node -e 'if (!process.env.CONVEX_DEPLOY_KEY) throw new Error("Missing CONVEX_DEPLOY_KEY")'
          pnpm exec convex deploy --typecheck enable
