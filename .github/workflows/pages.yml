name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build website
        env:
          VITE_BASE_PATH: /bestbryt-fuel-credit/
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_HERCULES_OIDC_AUTHORITY: ${{ secrets.VITE_HERCULES_OIDC_AUTHORITY }}
          VITE_HERCULES_OIDC_CLIENT_ID: ${{ secrets.VITE_HERCULES_OIDC_CLIENT_ID }}
          VITE_HERCULES_WEBSITE_ID: 01M0CT57Y07T916YEXC6GKE4QR
        run: |
          node -e 'for (const k of ["VITE_CONVEX_URL","VITE_HERCULES_OIDC_AUTHORITY","VITE_HERCULES_OIDC_CLIENT_ID"]) if (!process.env[k]) throw new Error("Missing repository secret: " + k)'
          pnpm build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
