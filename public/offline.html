<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — BESTBRYT VENTURES</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #1a3340;
        color: #fff;
        padding: 2rem;
      }
      .container {
        text-align: center;
        max-width: 320px;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        display: block;
      }
      .brand {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #f59e0b;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.9rem;
        color: rgba(255,255,255,0.65);
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      button {
        background: #f59e0b;
        color: #1a1a1a;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #d97706; }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="icon">⛽</span>
      <p class="brand">BESTBRYT VENTURES</p>
      <h1>You're offline</h1>
      <p>No internet connection. Please check your network and try again.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
